              var pad = function(n) { return (n < 10 ? '0' : '') + n; };
              var clockStr = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
              var elapsedStr = diffSec === 0 ? '(الآن • 0 ثانية)' : (diffSec < 60 ? '(منذ ' + diffSec + ' ثانية)' : '(منذ ' + Math.floor(diffSec / 60) + ' د و ' + (diffSec % 60) + ' ثانية)');
              var dotEl = document.getElementById('kdz-sync-dot');
              var stateEl = document.getElementById('kdz-sync-state');
              var clockEl = document.getElementById('kdz-sync-clock');
              var elapsedEl = document.getElementById('kdz-sync-elapsed');
              if (dotEl) dotEl.style.background = isOn ? '#10b981' : '#ef4444';
              if (stateEl) {
                stateEl.textContent = isOn ? 'متصل أونلاين (Online)' : 'غير متصل (Offline)';
                stateEl.style.color = isOn ? '#059669' : '#dc2626';
              }
              if (clockEl) clockEl.textContent = clockStr;
              if (elapsedEl) elapsedEl.textContent = elapsedStr;
            } catch (e) {}
          }, 1000);
        } catch (err) {}
      })();
    </script>

    <script>
      if ('caches' in window) {
        caches.keys().then(function(ks) {
          ks.forEach(function(k) { caches.delete(k); });
        }).catch(function() {});
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg) {
            try { reg.update(); } catch (e) {}
          }).catch(function() {});
        });
      }
      setTimeout(function() {
        var loader = document.getElementById('kdz-boot-loader');
        if (loader) {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(rs) {
                rs.forEach(function(r) { r.unregister(); });
              });
            }
            if (!sessionStorage.getItem('kdz_recovered_once')) {
              sessionStorage.setItem('kdz_recovered_once', '1');
              window.location.reload();
            }
          } catch (e) {}
        }
      }, 3500);
