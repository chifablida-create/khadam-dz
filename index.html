                  '<button type="button" id="kdz-gb-imp-btn" style="width:100%;background:#16a34a;color:#fff;border:none;border-radius:12px;padding:10px;font-size:12px;font-weight:900;cursor:pointer;">📥 إدخال وحفظ بيانات الجميع في المنصة والسحابة الآن</button>' +
                '</div>' +
              '</div>';
            document.body.appendChild(modal);

            var showGbMsg = function(txt) {
              var m = document.getElementById('kdz-gb-msg');
              if (m) {
                m.style.display = 'block';
                m.textContent = txt;
              }
            };
            var refreshGbStats = function() {
              var stEl = document.getElementById('kdz-gb-stats');
              if (!stEl) return;
              var rCount = buildActiveReqsArray(false).length;
              var cCount = buildActiveCraftsmenArray().length;
              stEl.innerHTML =
                '<div style="background:#ecfdf5;padding:8px;border-radius:12px;border:1px solid #a7f3d0;">⚡ نبضات منع النوم: <b style="color:#059669;">' + window.__KDZ_BOT_STATS__.heartbeats + '</b></div>' +
                '<div style="background:#fef3c7;padding:8px;border-radius:12px;border:1px solid #fde68a;">🛡️ الهجمات المصدودة: <b style="color:#d97706;">' + window.__KDZ_BOT_STATS__.blockedAttacks + '</b></div>' +
                '<div style="background:#e0f2fe;padding:8px;border-radius:12px;border:1px solid #bae6fd;">🛠️ الأخطاء المصححة: <b style="color:#0284c7;">' + window.__KDZ_BOT_STATS__.fixedErrors + '</b></div>' +
                '<div style="background:#f3e8ff;padding:8px;border-radius:12px;border:1px solid #e9d5ff;">💾 المحمية: <b style="color:#7e22ce;">' + rCount + ' طلب + ' + cCount + ' حرفي</b></div>';
            };
            refreshGbStats();

            document.getElementById('kdz-gb-close').onclick = function() { modal.style.display = 'none'; };
            document.getElementById('kdz-gb-heal').onclick = function() {
              runGuardianAutoHealAndPulse(true);
              refreshGbStats();
              showGbMsg('✅ تم تصحيح كل الأخطاء، تطهير القوائم، وتنشيط الروابط ضد النوم بنجاح!');
            };
            document.getElementById('kdz-gb-cloud').onclick = function() {
              broadcastAllEveryoneToCloud();
              refreshGbStats();
              showGbMsg('☁️ تم بث ومزامنة جميع الطلبات والحرفيين إلى السحابة والروابط الحية فوراً!');
            };
            document.getElementById('kdz-gb-exp-json').onclick = function() {
              exportEveryoneJson();
              showGbMsg('📤 تم تحميل ملف JSON الشامل لبيانات الجميع!');
            };
            document.getElementById('kdz-gb-exp-csv').onclick = function() {
              exportEveryoneCsv();
              showGbMsg('📊 تم تحميل جدول Excel/CSV الشامل لبيانات الجميع!');
            };
            document.getElementById('kdz-gb-exp-copy').onclick = function() {
              var payload = { requests: buildActiveReqsArray(false), craftsmen: buildActiveCraftsmenArray() };
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
              }
              showGbMsg('📋 تم نسخ جميع بيانات الطلبات والحرفيين إلى الحافظة!');
            };
            document.getElementById('kdz-gb-imp-btn').onclick = function() {
              var inp = document.getElementById('kdz-gb-input');
              var res = importEveryoneDataRaw(inp ? inp.value : '');
              if (inp) inp.value = '';
              refreshGbStats();
              showGbMsg('📥 تم إدخال ' + res.reqs + ' طلب زبون و ' + res.crs + ' حرفي وبثها لجميع الهواتف بنجاح!');
            };
            var fileInp = document.getElementById('kdz-gb-file');
            if (fileInp) {
              fileInp.onchange = function(ev) {
                var f = ev.target && ev.target.files ? ev.target.files[0] : null;
                if (!f) return;
                var reader = new FileReader();
                reader.onload = function() {
                  var res = importEveryoneDataRaw(String(reader.result || ''));
                  refreshGbStats();
                  showGbMsg('📂 تم استيراد الملف بنجاح: ' + res.reqs + ' طلب زبون و ' + res.crs + ' حرفي!');
                };
                reader.readAsText(f);
              };
            }
          };

          setInterval(function() {
            try {
              var syncBar = document.getElementById('kdz-admin-live-sync-bar') || document.getElementById('kdz-admin-live-sync-bar-injected');
              if (syncBar && !document.getElementById('kdz-open-guardian-bot-btn')) {
                var gBtn = document.createElement('button');
                gBtn.type = 'button';
                gBtn.id = 'kdz-open-guardian-bot-btn';
                gBtn.style.cssText = 'background:linear-gradient(90deg,#047857,#0f766e);color:#fff;border:1px solid #34d399;border-radius:8px;padding:3px 9px;font-size:10px;font-weight:900;cursor:pointer;margin-right:4px;';
                gBtn.textContent = '🛡️ بوت الحماية وإدخال/إخراج البيانات';
                gBtn.onclick = openGuardianBotModal;
                syncBar.appendChild(gBtn);
              }
            } catch (e) {}
          }, 1000);

          // 16. درع وبوت أرشفة جوجل الفورية (Google Search Console & Instant SEO Indexing Shield)
          try {
            var currentOrigin = (window.location && window.location.origin && window.location.origin.indexOf('http') === 0)
              ? window.location.origin + '/'
              : 'https://khadam-dz-2q6o.vercel.app/';
            var canEl = document.getElementById('kdz-canonical-link') || document.querySelector('link[rel="canonical"]');
            if (canEl) canEl.setAttribute('href', currentOrigin);
            var ogUrlEl = document.getElementById('kdz-og-url') || document.querySelector('meta[property="og:url"]');
            if (ogUrlEl) ogUrlEl.setAttribute('content', currentOrigin);
            var metaRobots = document.querySelectorAll('meta[name="robots"], meta[name="googlebot"]');
            for (var mr = 0; mr < metaRobots.length; mr++) {
              metaRobots[mr].setAttribute('content', 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
            }
            function triggerSearchEngineIndexingPing() {
              var urls = [
                'https://khadam-dz-2q6o.vercel.app/',
                'https://khadam-dz-adua.vercel.app/',
                'https://khadam-dz-2q6o.vercel.app/sitemap.xml',
                'https://khadam-dz-adua.vercel.app/sitemap.xml'
              ];
              for (var u = 0; u < urls.length; u++) {
                try { fetch(urls[u], { mode: 'no-cors', cache: 'no-store' }).catch(function(){}); } catch (e) {}
              }
            }
            setTimeout(triggerSearchEngineIndexingPing, 2500);
          } catch (seoErr) {}
        } catch (err) {}
      })();
    </script>
