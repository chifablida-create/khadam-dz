<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Khadma DZ - زر واضح RIB + وصل</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Tajawal',system-ui}</style>
</head>
<body class="bg-[#f8fafc]">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
const WILAYAS=["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة","تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة","سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر","ورقلة","وهران","البيض","إيليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت","غرداية","غليزان"];
const CRAFTS=["سباكة","كهرباء منزلية","نجارة","دهان وديكور","بناء وخرسانة","تبليط وسيراميك","حدادة ولحام","تكييف وتبريد","تصليح أجهزة كهرومنزلية","زجاج وألمنيوم","جبس وبلاكو بلاتر","سقف وايتانشيت","حفر آبار وخزانات","ميكانيك سيارات","كهرباء سيارات","دهان سيارات وتولوري","نقل وترحيل وشحن","تنظيف منازل وشركات","بستنة وفلاحة","حراسة وأمن","طبخ وتموين وحلويات","خياطة وطرز","حلاقة رجالية وتجميل","تصوير فوتوغرافي ومناسبات","صيانة هواتف وكمبيوتر","تركيب كاميرات مراقبة","تركيب بارابول وستالايت","تفصيل مطابخ وأثاث","إصلاح دراجات","دروس خصوصية","محاسبة وخدمات إدارية","سباغة سيارات","خدمة توصيل","تنجيد وتأثيث","إصلاح المصاعد"];
const initialCrafts=[{id:1,name:"محمد بوعلام",skill:"كهرباء منزلية",wilaya:"الجزائر",baladiya:"بئر مراد رايس",rating:4.9,jobs:127,points:45,blocked:false,phone:"0798112233"},{id:2,name:"كريم حداد",skill:"سباكة",wilaya:"وهران",baladiya:"السانية",rating:4.8,jobs:98,points:12,blocked:false,phone:"0798445566"}];
const initialReq=[{id:1,title:"إصلاح تسرب ماء في المطبخ",skill:"سباكة",wilaya:"الجزائر",baladiya:"بئر مراد رايس",phone:"0551234567",phoneRevealed:false,date:"اليوم"}];

function App(){
const [crafts,setCrafts]=useState(()=>{try{const s=localStorage.getItem('khadma_crafts'); return s?JSON.parse(s):initialCrafts;}catch{return initialCrafts;}});
const [reqs,setReqs]=useState(()=>{try{const s=localStorage.getItem('khadma_reqs'); return s?JSON.parse(s):initialReq;}catch{return initialReq;}});
const [purchases,setPurchases]=useState(()=>{try{const s=localStorage.getItem('khadma_purchases'); return s?JSON.parse(s):[];}catch{return [];}});
const [showAdmin,setShowAdmin]=useState(false); const [adminTab,setAdminTab]=useState("craftsmen"); const [isAdmin,setIsAdmin]=useState(false); const [pass,setPass]=useState(""); const [toast,setToast]=useState(null);
const rib="00799999000122089353";
const [title,setTitle]=useState(""); const [phone,setPhone]=useState(""); const [wilaya,setWilaya]=useState(""); const [baladiya,setBaladiya]=useState(""); const [skill,setSkill]=useState("سباكة");
const [showCraftReg,setShowCraftReg]=useState(false); const [cName,setCName]=useState(""); const [cPhone,setCPhone]=useState(""); const [cSkill,setCSkill]=useState("سباكة"); const [cWilaya,setCWilaya]=useState(""); const [cCity,setCCity]=useState("");
const [showReceiptModal,setShowReceiptModal]=useState(false); const [selectedPack,setSelectedPack]=useState(null); const [receiptPreview,setReceiptPreview]=useState(null); const fileRef=useRef(null);
const [logs,setLogs]=useState([{time:"10:32",action:"الروبوت جاهز"}]);
const [currentCraftId,setCurrentCraftId]=useState(()=>{try{return JSON.parse(localStorage.getItem('khadma_current')||'null')}catch{return null}});
const [showCustomerLogin,setShowCustomerLogin]=useState(false); const [currentCustomerPhone,setCurrentCustomerPhone]=useState(()=>{try{return localStorage.getItem('khadma_customer')||''}catch{return ''}}); const [customerTab,setCustomerTab]=useState("myRequests");
useEffect(()=>{try{localStorage.setItem('khadma_crafts',JSON.stringify(crafts))}catch{}},[crafts]);
useEffect(()=>{try{localStorage.setItem('khadma_reqs',JSON.stringify(reqs))}catch{}},[reqs]);
useEffect(()=>{try{localStorage.setItem('khadma_purchases',JSON.stringify(purchases))}catch{}},[purchases]);
useEffect(()=>{try{localStorage.setItem('khadma_current',JSON.stringify(currentCraftId))}catch{}},[currentCraftId]);
useEffect(()=>{try{localStorage.setItem('khadma_customer',currentCustomerPhone)}catch{}},[currentCustomerPhone]);
const currentCraft = crafts.find(c=>c.id===currentCraftId) || null;
const showToast=(m)=>{setToast(m); setTimeout(()=>setToast(null),3500);};
const maskPhone=(p)=>{if(!p) return "••••••••••"; const t=p.replace(/\s/g,""); return t.slice(0,2)+" •• •• •• "+t.slice(-2);};
const formatPhone=(p)=>p.replace(/\s/g,"").replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/,"$1 $2 $3 $4 $5");
const validatePhone=(p)=>/^(0)(5|6|7)[0-9]{8}$/.test(p.replace(/\s/g,""));
const revealCustomerPhone=(id)=>{
 if(!currentCraft){showToast("⚠️ سجل كحرفي أولا - اضغط سجل كحرفي"); return;}
 if(currentCraft.blocked){showToast("🚫 حسابك محظور"); return;}
 if(currentCraft.points < 25){showToast(`❌ نقاطك ${currentCraft.points} - تحتاج 25 نقطة! اشتر باقة`); return;}
 setCrafts(prev=>prev.map(c=> c.id===currentCraft.id ? {...c,points:c.points-25} : c));
 setReqs(prev=>prev.map(r=> r.id===id && !r.phoneRevealed ? {...r,phoneRevealed:true, revealedBy:currentCraft.id} : r));
 showToast(`✅ خصم 25 نقطة - بقي ${currentCraft.points-25}`);
};
const handleBuyPack=(name,price)=>{
 console.log("شراء باقة:",name,price);
 setSelectedPack({name,price}); setReceiptPreview(null); setShowReceiptModal(true);
 showToast(`فتح باقة ${name} - RIB: ${rib}`);
};
const handleFileChange=(e)=>{
 try{
  const f=e.target.files[0]; if(!f) return;
  if(f.size > 5*1024*1024){showToast('الصورة كبيرة'); return;}
  const reader=new FileReader(); 
  reader.onload=(ev)=>{setReceiptPreview(ev.target.result); showToast('✅ تم تحميل الوصل - اضغط تأكيد');};
  reader.readAsDataURL(f);
 }catch(err){showToast('خطأ تحميل');}
};
const submitReceipt=()=>{
 if(!receiptPreview){showToast("❌ اضغط على زر تحميل الوصل أولا"); return;}
 setPurchases(prev=>[{id:Date.now(),craftsman:currentCraft?.name||"حرفي جديد",pack:selectedPack.name,price:selectedPack.price,status:"pending",receipt:receiptPreview,rib:rib},...prev]);
 setShowReceiptModal(false); showToast("✅ تم إرسال الوصل - الروبوت سيقرأه");
};
const registerCraftsman=()=>{
 if(!cName.trim()||!cPhone.trim()||!cWilaya||!cCity.trim()){showToast("املأ الحقول *"); return;}
 if(!validatePhone(cPhone)){showToast("رقم غير صحيح"); return;}
 const newCraft={id:Date.now(),name:cName.trim(),skill:cSkill,wilaya:cWilaya,baladiya:cCity.trim(),rating:4.5,jobs:0,points:20,blocked:false,phone:cPhone.replace(/\s/g,"")};
 setCrafts(p=>[newCraft,...p]); setCurrentCraftId(newCraft.id); setCName(""); setCPhone(""); setCWilaya(""); setCCity(""); setShowCraftReg(false);
 showToast("✅ تم تسجيلك - 20 نقطة هدية");
};
const loginCraftsman=(phoneInput)=>{
 const clean = phoneInput.replace(/\s/g,""); const found = crafts.find(c=>c.phone===clean);
 if(!found){showToast("رقم غير مسجل"); return false;}
 setCurrentCraftId(found.id); showToast(`مرحبا ${found.name} - ${found.points} نقطة`); return true;
};
const addRequest=()=>{
 if(!title.trim()||!phone.trim()||!wilaya||!baladiya.trim()){showToast("املأ الحقول *"); return;}
 if(!validatePhone(phone)){showToast("رقم غير صحيح"); return;}
 setReqs(p=>[{id:Date.now(),title:title.trim(),skill,wilaya,baladiya:baladiya.trim(),phone:phone.replace(/\s/g,""),phoneRevealed:false,date:"الآن"},...p]);
 setTitle(""); setPhone(""); setWilaya(""); setBaladiya(""); showToast("تم نشر طلبك ✓");
};
const runRobotScan=()=>{
 try{
  let c=0; setCrafts(prev=>prev.map(x=>{if(x.rating<4.7 && x.jobs<20 && !x.blocked){c++; return {...x,blocked:true};} return x;}));
  setLogs(p=>[{time:new Date().toLocaleTimeString(),action:`🤖 فحص ${crafts.length} حرفي - حظر ${c} - قراءة ${purchases.length} وصل`},...p]);
  showToast(`🤖 فحص ${c} محظور - ${purchases.length} وصل`);
 }catch(e){showToast('خطأ روبوت');}
};

return (
<div dir="rtl" className="min-h-screen text-[#0f172a]">
<header className="sticky top-0 z-20 bg-[#0f172a] text-white h-[64px] flex items-center px-4">
<div className="flex items-center gap-2"><div className="w-9 h-9 rounded-[10px] bg-[#f97316] flex items-center justify-center font-extrabold">K</div><div><div className="font-extrabold">Khadma DZ</div><div className="text-[10px] text-white/60">{currentCraft?`👋 ${currentCraft.name} - ${currentCraft.points}ن`:"سجل كحرفي واكسب نقاط"}</div></div></div>
<div className="mr-auto flex gap-2">
<button onClick={()=>setShowCustomerLogin(true)} className="h-9 px-3 rounded-full bg-white/20 text-white text-[11px] font-bold">👤 زبون</button>
<button onClick={()=>setShowCraftReg(true)} className="h-9 px-3 rounded-full bg-white text-[#0f172a] text-[11px] font-bold">{currentCraft?`${currentCraft.points}ن`:"🔧 سجل كحرفي"}</button>
<button onClick={()=>setShowAdmin(true)} className="w-8 h-8 rounded-full bg-[#f97316] flex items-center justify-center">🤖</button>
</div>
</header>

<div className="bg-[#0f172a] text-white p-6"><h1 className="text-[26px] font-extrabold">أحتاج حرفي موثوق؟</h1><p className="text-[13px] text-white/60 mt-1">500 حرفي في 58 ولاية - {currentCraft?`نقاطك: ${currentCraft.points}`:"20 نقطة هدية عند التسجيل"}</p></div>

<div className="p-4 -mt-6"><div className="bg-white rounded-[16px] border p-4 shadow-sm">
<div className="font-bold text-[14px] mb-3">📋 أنشر طلبك (الزبون)</div>
<input value={title} onChange={e=>setTitle(e.target.value)} placeholder="ماذا تحتاج؟ *" className="w-full h-11 border rounded-[10px] px-3 text-[13px] mb-2"/>
<div className="grid grid-cols-2 gap-2 mb-2">
<select value={skill} onChange={e=>setSkill(e.target.value)} className="h-11 border rounded-[10px] px-2 text-[13px]">{CRAFTS.map(c=><option key={c} value={c}>{c}</option>)}</select>
<select value={wilaya} onChange={e=>setWilaya(e.target.value)} className="h-11 border rounded-[10px] px-2 text-[13px]"><option value="">الولاية *</option>{WILAYAS.map(w=><option key={w} value={w}>{w}</option>)}</select>
</div>
<input value={baladiya} onChange={e=>setBaladiya(e.target.value)} placeholder="البلدية *" className="w-full h-11 border rounded-[10px] px-3 text-[13px] mb-2"/>
<input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="هاتفك 07XXXXXXXX *" className="w-full h-11 border rounded-[10px] px-3 text-[13px] mb-3"/>
<button onClick={addRequest} className="w-full h-11 rounded-[10px] bg-[#0f172a] text-white font-bold">انشر مجانا</button>
</div></div>

<div className="p-4">
<div className="bg-[#0f172a] rounded-[16px] p-4 text-white border-2 border-[#f97316]">
<div className="font-bold text-[15px]">💳 باقات النقاط - اضغط على الباقة ليخرج RIB + زر التحميل</div>
<div className="mt-1 text-[11px] text-white/60">كل زر يفتح نافذة فيها RIB الأصلي + مكان تحميل الوصل</div>
<div className="mt-4 grid grid-cols-2 gap-3">
<button onClick={()=>handleBuyPack("100 نقطة","1000 دج")} className="bg-white/10 hover:bg-white/20 border-2 border-white/20 rounded-[12px] p-4 text-center">
<div className="text-[22px] font-extrabold">100</div><div className="text-[12px]">نقطة</div><div className="mt-2 bg-white text-[#0f172a] rounded-full py-1 text-[11px] font-bold">1000 دج - اضغط هنا</div><div className="text-[9px] mt-1 text-white/50">يفتح RIB + تحميل</div>
</button>
<button onClick={()=>handleBuyPack("200 نقطة","2000 دج")} className="bg-[#f97316] rounded-[12px] p-4 text-center border-2 border-[#f97316]">
<div className="text-[22px] font-extrabold">200</div><div className="text-[12px]">نقطة ⭐</div><div className="mt-2 bg-white text-[#f97316] rounded-full py-1 text-[11px] font-bold">2000 دج - اضغط هنا</div><div className="text-[9px] mt-1">الأكثر طلبا</div>
</button>
<button onClick={()=>handleBuyPack("300 نقطة","3000 دج")} className="bg-white text-[#0f172a] rounded-[12px] p-4 text-center">
<div className="text-[22px] font-extrabold">300</div><div className="text-[12px]">نقطة</div><div className="mt-2 bg-[#0f172a] text-white rounded-full py-1 text-[11px] font-bold">3000 دج - اضغط هنا</div>
</button>
<button onClick={()=>handleBuyPack("400 نقطة","4000 دج")} className="bg-gradient-to-br from-[#f97316] to-[#fb923c] rounded-[12px] p-4 text-center border-2 border-white">
<div className="text-[22px] font-extrabold">400</div><div className="text-[12px]">نقطة 🔥</div><div className="mt-2 bg-white text-[#f97316] rounded-full py-1 text-[11px] font-bold">4000 دج - اضغط هنا</div><div className="text-[9px] mt-1">أفضل قيمة</div>
</button>
</div>
<div className="mt-3 p-2 bg-black/30 rounded-[8px] text-[10px] text-center">💡 اضغط على أي باقة - ستظهر نافذة كبيرة فيها RIB الأصلي وزر تحميل الوصل بوضوح</div>
</div>
</div>

<div className="p-4">
<div className="font-bold text-[14px] mb-2">طلبات الزبائن (25 نقطة للكشف):</div>
<div className="space-y-2">
{reqs.map(r=>(
<div key={r.id} className="bg-white border rounded-[12px] p-3">
<div className="flex justify-between"><span className="text-[10px] bg-[#f1f5f9] px-2 py-1 rounded-full">{r.phoneRevealed?"مكشوف":"مغلق"}</span><span className="font-bold text-[13px]">{r.title}</span></div>
<div className="text-[11px] text-[#64748b] mt-1">{r.skill} • {r.wilaya} - {r.baladiya}</div>
<div className="mt-2 flex justify-between items-center">
<div className="text-[11px] font-mono">هاتف : {r.phoneRevealed?formatPhone(r.phone):maskPhone(r.phone)}</div>
{r.phoneRevealed?<a href={`tel:${r.phone}`} className="h-8 px-3 rounded-full bg-emerald-600 text-white text-[11px] font-bold">اتصل 📞</a>:
<button onClick={()=>revealCustomerPhone(r.id)} className="h-8 px-3 rounded-full bg-[#f97316] text-white text-[11px] font-bold">كشف - 25 نقطة</button>}
</div>
</div>
))}
</div>
</div>

{showReceiptModal&&(
<div className="fixed inset-0 z-[100] bg-black/70 flex items-center justify-center p-4">
<div className="bg-white rounded-[20px] w-full max-w-[400px] p-0 overflow-hidden">
<div className="bg-[#f97316] text-white p-4 text-center"><div className="text-[20px]">💳</div><div className="font-extrabold text-[16px] mt-1">باقة {selectedPack?.name}</div><div className="text-[13px] opacity-90">{selectedPack?.price}</div></div>
<div className="p-5">
<div className="bg-[#0f172a] text-white rounded-[14px] p-4">
<div className="text-[11px] text-white/60">🔑 RIB الأصلي - حول عليه المبلغ:</div>
<div className="mt-2 bg-white text-[#0f172a] rounded-[10px] p-3 font-mono font-extrabold text-[15px] tracking-wider select-all text-center">{rib}</div>
<button onClick={()=>{navigator.clipboard.writeText(rib); showToast('✅ تم نسخ RIB');}} className="mt-2 w-full h-8 rounded-full bg-white/10 text-[11px]">📋 انسخ RIB</button>
</div>
<div className="mt-4">
<div className="font-bold text-[13px]">📤 زر تحميل الوصل - المخالصة:</div>
<div className="text-[11px] text-[#64748b] mt-1">بعد ما تحول الدراهم، صور الوصل وحمله هنا:</div>
<div onClick={()=>fileRef.current?.click()} className="mt-3 h-[160px] border-[3px] border-dashed border-[#f97316] rounded-[14px] flex flex-col items-center justify-center cursor-pointer bg-[#fff7ed] overflow-hidden">
{receiptPreview?<img src={receiptPreview} className="w-full h-full object-cover"/>:(
<>
<div className="w-14 h-14 bg-[#f97316] rounded-full flex items-center justify-center text-white text-[24px]">📤</div>
<div className="font-extrabold text-[14px] mt-2">اضغط هنا لتحميل الوصل</div>
<div className="text-[11px] text-[#64748b] mt-1">صورة المخالصة / Versement</div>
<div className="mt-2 px-3 py-1 bg-[#f97316] text-white rounded-full text-[10px]">اختر صورة من الهاتف</div>
</>
)}
</div>
<input ref={fileRef} type="file" accept="image/*" onChange={handleFileChange} className="hidden"/>
{receiptPreview&&<div className="mt-2 p-2 bg-emerald-50 border border-emerald-200 rounded-[8px] text-[11px] text-emerald-700 text-center">✅ تم تحميل الوصل بنجاح - اضغط تأكيد الآن</div>}
</div>
<div className="flex gap-2 mt-5">
<button onClick={()=>setShowReceiptModal(false)} className="flex-1 h-12 rounded-[12px] bg-[#f1f5f9] font-bold">إلغاء</button>
<button onClick={submitReceipt} disabled={!receiptPreview} className={`flex-1 h-12 rounded-[12px] font-bold text-white ${receiptPreview?"bg-[#0f172a]":"bg-gray-300"}`}>{receiptPreview?"✅ تأكيد وإرسال الوصل":"حمل الوصل أولا"}</button>
</div>
</div>
</div>
</div>
)}

{showCraftReg&&(
<div className="fixed inset-0 z-[100] bg-black/50 flex items-end"><div className="bg-white rounded-t-[16px] w-full p-5 max-h-[90vh] overflow-auto">
<h3 className="font-bold">دخول / تسجيل حرفي</h3>
<div className="mt-3"><input id="loginPhone" placeholder="07XXXXXXXX - دخول" className="w-full h-11 border-2 border-[#0f172a] rounded-[10px] px-3 text-[13px]"/><button onClick={()=>{const el=document.getElementById('loginPhone'); if(loginCraftsman(el.value)){setShowCraftReg(false);}}} className="mt-2 w-full h-10 rounded-[10px] bg-[#0f172a] text-white font-bold text-[12px]">دخول - البحث عن حسابي</button></div>
<div className="mt-4 border-t pt-4">
<input value={cName} onChange={e=>setCName(e.target.value)} placeholder="اسمك *" className="w-full h-11 border rounded-[10px] px-3 text-[13px] mb-2"/>
<input value={cPhone} onChange={e=>setCPhone(e.target.value)} placeholder="هاتفك 07XXXXXXXX *" className="w-full h-11 border rounded-[10px] px-3 text-[13px] mb-2"/>
<div className="grid grid-cols-2 gap-2 mb-2">
<select value={cSkill} onChange={e=>setCSkill(e.target.value)} className="h-11 border rounded-[10px] px-2 text-[13px]">{CRAFTS.map(c=><option key={c} value={c}>{c}</option>)}</select>
<select value={cWilaya} onChange={e=>setCWilaya(e.target.value)} className="h-11 border rounded-[10px] px-2 text-[13px]"><option value="">الولاية *</option>{WILAYAS.map(w=><option key={w} value={w}>{w}</option>)}</select>
</div>
<input value={cCity} onChange={e=>setCCity(e.target.value)} placeholder="البلدية *" className="w-full h-11 border rounded-[10px] px-3 text-[13px] mb-2"/>
</div>
<div className="flex gap-2 mt-4"><button onClick={()=>setShowCraftReg(false)} className="flex-1 h-11 rounded-[10px] bg-[#f1f5f9] font-bold">إلغاء</button><button onClick={registerCraftsman} className="flex-1 h-11 rounded-[10px] bg-[#0f172a] text-white font-bold">سجل +20 نقطة</button></div>
</div></div>
)}

{showCustomerLogin&&(
<div className="fixed inset-0 z-[100] bg-black/60 flex items-end sm:items-center sm:justify-center p-0 sm:p-4">
<div className="bg-white rounded-t-[20px] sm:rounded-[20px] w-full sm:max-w-[420px] max-h-[90vh] overflow-auto">
<div className="bg-[#0f172a] text-white p-4"><div className="flex justify-between items-center"><div className="font-bold">👤 حسابي زبون</div><button onClick={()=>setShowCustomerLogin(false)} className="w-8 h-8 bg-white/10 rounded-full">✕</button></div></div>
{!currentCustomerPhone?(
<div className="p-5">
<input id="custPhone" placeholder="07XXXXXXXX" className="w-full h-12 border-2 border-[#0f172a] rounded-[12px] px-4 text-[14px] text-center"/>
<div className="flex gap-2 mt-4">
<button onClick={()=>setShowCustomerLogin(false)} className="flex-1 h-11 rounded-[12px] bg-[#f1f5f9] font-bold">إلغاء</button>
<button onClick={()=>{const el=document.getElementById('custPhone'); const p=el.value.replace(/\s/g,''); if(!/^(0)(5|6|7)[0-9]{8}$/.test(p)){showToast('رقم غير صحيح'); return;} setCurrentCustomerPhone(p); showToast(`وجدنا ${reqs.filter(r=>r.phone===p).length} طلبات`);}} className="flex-1 h-11 rounded-[12px] bg-[#0f172a] text-white font-bold">دخول</button>
</div>
</div>
):(
<div className="p-4">
<div className="space-y-2">{reqs.filter(r=>r.phone===currentCustomerPhone).map(r=><div key={r.id} className="bg-white border rounded-[12px] p-3"><div className="font-bold text-[13px]">{r.title}</div><div className="text-[11px] text-[#64748b]">{r.skill} • {r.wilaya}</div></div>)}</div>
<button onClick={()=>{setCurrentCustomerPhone(''); setShowCustomerLogin(false);}} className="mt-4 w-full h-11 rounded-[12px] bg-red-50 text-red-600 font-bold">خروج</button>
</div>
)}
</div></div>
)}

{showAdmin&&(
<div className="fixed inset-0 z-[90] flex">
<div className="flex-1 bg-black/60" onClick={()=>setShowAdmin(false)}></div>
<div className="w-full max-w-[520px] bg-[#f8fafc] h-full flex flex-col">
<div className="bg-[#0f172a] text-white p-4">
<div className="flex justify-between items-center"><div className="font-bold">🤖 إدارة - الروبوت يقرأ الوصولات</div><button onClick={()=>setShowAdmin(false)} className="w-8 h-8 bg-white/10 rounded-full">✕</button></div>
{!isAdmin?<div className="mt-3 flex gap-2"><input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="ameurali" className="flex-1 h-9 rounded-[10px] bg-[#020617] border border-white/10 px-3 text-[13px]"/><button onClick={()=>{if(pass==="ameurali"){setIsAdmin(true);}else showToast("خطأ");}} className="h-9 px-4 rounded-[10px] bg-[#f97316] font-bold text-[12px]">دخول</button></div>:
<div className="mt-3 flex gap-2">
<button onClick={()=>setAdminTab("craftsmen")} className={`px-3 h-8 rounded-full text-[12px] font-bold ${adminTab==="craftsmen"?"bg-[#f97316]":"bg-white/10"}`}>الحرفيين</button>
<button onClick={()=>setAdminTab("purchases")} className={`px-3 h-8 rounded-full text-[12px] font-bold ${adminTab==="purchases"?"bg-[#f97316]":"bg-white/10"}`}>الوصولات ({purchases.length})</button>
<button onClick={runRobotScan} className="px-3 h-8 rounded-full bg-emerald-600 text-white text-[11px]">🤖 فحص وقراءة</button>
</div>}
</div>
<div className="flex-1 overflow-auto p-3">
{!isAdmin?<div className="text-center py-20">🔒</div>:
adminTab==="craftsmen"?<div className="space-y-2">{crafts.map(c=><div key={c.id} className="bg-white border rounded-[12px] p-3"><div className="font-bold text-[13px]">{c.name} - {c.points} نقطة</div><div className="text-[11px]">{c.phone} - {c.skill}</div><button onClick={()=>setCrafts(prev=>prev.map(x=>x.id===c.id?{...x,points:x.points+100}:x))} className="mt-1 h-6 px-2 rounded-full bg-[#f1f5f9] text-[10px]">+100</button></div>)}</div>:
<div className="space-y-2">{purchases.map(p=><div key={p.id} className="bg-white border rounded-[12px] p-3"><div className="font-bold text-[12px]">{p.pack} - {p.price} - {p.status}</div><div className="text-[10px]">RIB: {p.rib}</div>{p.receipt&&<img src={p.receipt} className="mt-2 w-full h-40 object-cover rounded-[8px] border-2 border-[#f97316]"/>}<div className="flex gap-2 mt-2"><button onClick={()=>{let pts=parseInt(p.pack)||100; setCrafts(prev=>prev.map(c=>c.name===p.craftsman?{...c,points:c.points+pts}:c)); setPurchases(prev=>prev.map(x=>x.id===p.id?{...x,status:"تم - "+pts} :x)); showToast(`تم تفعيل ${pts}`);}} className="h-8 px-3 rounded-full bg-emerald-600 text-white text-[11px]">✅ تفعيل بعد قراءة الوصل</button></div></div>)}</div>
}
</div>
</div>
</div>
)}

{toast&&<div className="fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#0f172a] text-white px-4 py-2 rounded-full text-[13px] z-[200] text-center max-w-[90%]">{toast}</div>}
</div>
);
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
