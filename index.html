    <!-- درع التوافق الشامل مع جميع إصدارات الأندرويد القديمة والضعيفة ومتصفحات فيسبوك وواتساب -->
    <script>
      (function() {
        try {
          // 1. globalThis polyfill (Android < 8 / Chrome < 71)
          if (typeof window.globalThis === 'undefined') {
            window.globalThis = window;
          }

          // 2. Safe localStorage & sessionStorage shield for restricted Facebook/WhatsApp WebViews
          try {
            var testKey = '__kdz_test__';
            window.localStorage.setItem(testKey, '1');
            window.localStorage.removeItem(testKey);
          } catch (storageErr) {
            var memStore = {};
            var safeStorage = {
              getItem: function(k) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
              setItem: function(k, v) { memStore[k] = String(v); },
              removeItem: function(k) { delete memStore[k]; },
              clear: function() { memStore = {}; },
              key: function(i) { var keys = Object.keys(memStore); return keys[i] || null; },
              get length() { return Object.keys(memStore).length; }
            };
            try {
              Object.defineProperty(window, 'localStorage', { value: safeStorage, configurable: true });
              Object.defineProperty(window, 'sessionStorage', { value: safeStorage, configurable: true });
            } catch (e) {}
          }

          // 3. Object.hasOwn polyfill (Android < 10 / Chrome < 93)
          if (!Object.hasOwn) {
            Object.hasOwn = function(obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            };
          }

          // 4. Object.fromEntries polyfill (Chrome < 73)
          if (!Object.fromEntries) {
            Object.fromEntries = function(entries) {
              var obj = {};
              if (entries) {
                for (var i = 0; i < entries.length; i++) {
                  if (entries[i]) obj[entries[i][0]] = entries[i][1];
                }
              }
              return obj;
            };
          }

          // 5. Array.prototype.at & String.prototype.at polyfill (Android < 10 / Chrome < 92)
          if (!Array.prototype.at) {
            Array.prototype.at = function(n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this[n];
            };
          }
          if (!String.prototype.at) {
            String.prototype.at = function(n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this.charAt(n);
            };
          }

          // 6. Array.prototype.flat & flatMap polyfill (Chrome < 69)
          if (!Array.prototype.flat) {
            Array.prototype.flat = function(depth) {
              var d = depth === undefined ? 1 : Number(depth);
              var result = [];
              var flatten = function(arr, currentDepth) {
                for (var i = 0; i < arr.length; i++) {
                  if (Array.isArray(arr[i]) && currentDepth > 0) {
                    flatten(arr[i], currentDepth - 1);
                  } else {
                    result.push(arr[i]);
                  }
                }
              };
              flatten(this, d);
              return result;
            };
          }
          if (!Array.prototype.flatMap) {
            Array.prototype.flatMap = function(callback, thisArg) {
              return this.map(callback, thisArg).flat(1);
            };
          }

          // 7. String.prototype.replaceAll polyfill (Chrome < 85)
          if (!String.prototype.replaceAll) {
            String.prototype.replaceAll = function(str, newStr) {
              if (Object.prototype.toString.call(str).toLowerCase() === '[object regexp]') {
                return this.replace(str, newStr);
              }
              return this.split(str).join(newStr);
            };
          }

          // 8. Promise.allSettled & Promise.prototype.finally polyfill
          if (typeof Promise !== 'undefined' && !Promise.allSettled) {
            Promise.allSettled = function(promises) {
              return Promise.all(
                Array.prototype.map.call(promises, function(p) {
                  return Promise.resolve(p).then(
                    function(val) { return { status: 'fulfilled', value: val }; },
                    function(err) { return { status: 'rejected', reason: err }; }
                  );
                })
              );
            };
          }

          // 9. crypto.randomUUID polyfill (Chrome < 92 or insecure contexts)
          if (typeof window.crypto === 'undefined') {
            window.crypto = {};
          }
          if (typeof window.crypto.randomUUID !== 'function') {
            window.crypto.randomUUID = function() {
              return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = (Math.random() * 16) | 0;
                var v = c === 'x' ? r : (r & 0x3) | 0x8;
                return v.toString(16);
              });
            };
          }

          // 10. ResizeObserver & IntersectionObserver safe shims for old Android WebViews
          if (typeof window.ResizeObserver === 'undefined') {
            window.ResizeObserver = function() {};
            window.ResizeObserver.prototype.observe = function() {};
            window.ResizeObserver.prototype.unobserve = function() {};
            window.ResizeObserver.prototype.disconnect = function() {};
          }
          if (typeof window.IntersectionObserver === 'undefined') {
            window.IntersectionObserver = function() {};
            window.IntersectionObserver.prototype.observe = function() {};
            window.IntersectionObserver.prototype.unobserve = function() {};
            window.IntersectionObserver.prototype.disconnect = function() {};
          }

          // 11. Detect older Android (Android 5, 6, 7, 8, 9) or Low-RAM Phone (<= 2GB RAM) for 60FPS Lite GPU Mode
          var ua = navigator.userAgent || '';
          var androidMatch = ua.match(/Android\s+([0-9.]+)/i);
          var androidVer = androidMatch ? parseFloat(androidMatch[1]) : 99;
          var lowRam = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
          window.__KDZ_ANDROID_VERSION__ = androidMatch ? androidMatch[1] : null;
          window.__KDZ_IS_LEGACY_DEVICE__ = (androidVer <= 9) || Boolean(lowRam);

          if (window.__KDZ_IS_LEGACY_DEVICE__) {
            document.documentElement.className += ' legacy-android-lite';
          }
        } catch (err) {}
      })();
    </script>
